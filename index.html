<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webs de Javi</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{font-family:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;background:#f3ece0;color:#2e261f;
  min-height:100vh;padding:clamp(1.5rem,6vw,5rem);line-height:1.5}
h1{font-size:clamp(2.4rem,9vw,5rem);line-height:1;font-weight:800;letter-spacing:-.03em;margin-bottom:.6rem}
header p{max-width:40ch;margin-bottom:3rem}
ul{list-style:none;padding:0;max-width:44rem}
li{border-top:1px solid #2e261f}
li:last-child{border-bottom:1px solid #2e261f}
a{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;padding:1.2rem 0;
  color:inherit;text-decoration:none}
a strong{font-size:1.35rem}
a span{opacity:.7;text-align:right}
a:hover strong,a:focus-visible strong{color:#8a6a48;text-decoration:underline}
a:focus-visible{outline:3px solid #8a6a48;outline-offset:4px}
</style>
</head>
<body>
<header>
  <h1>Webs</h1>
  <p>Todas las páginas de este repositorio. Cada una vive en su propia carpeta.</p>
</header>
<main>
  <!-- Añade aquí una línea <li> por cada web nueva -->
  <ul>
    <li><a href="arquitecta/"><strong>Elena Guevara Flores</strong><span>Arquitecta</span></a></li>
  </ul>
</main>
</body>
</html>
